# rl-trading-live/config/phases.yaml
# ────────────────────────────────────────────────────────────────────────────
# AUTHORITATIVE 8-phase curriculum (ported from REPO1 / training_config.yaml).
# Each phase references a NAMED mask function in core/env/conditions_engine.py
# (MASK_REGISTRY) plus a mask_type and the timeframes the gate evaluates on.
#
# mask_type semantics (HARD RULE 12 + REPO1 _eval_mask):
#
#   force_in_and_gate / open_gate — AUTHORITATIVE GATE RULES:
#
#     Gate ON + no trades open
#         → strategy just triggered. Agent MUST get in immediately (BUY or SELL).
#           Agent picks direction and lot size — never forced by the code.
#
#     Gate ON + already in a trade
#         → strategy still active. Agent has COMPLETE FREEDOM:
#           add positions, hold, flip direction, partial close, full close.
#           A trade must be active at all times while the gate is ON.
#
#     Gate ON + agent just closed everything (went flat mid-gate)
#         → must immediately re-enter THAT SAME BAR. The mask is evaluated
#           every bar — agent cannot be flat for even one bar while gate fires.
#
#     Gate OFF + no trades open
#         → no valid setup. Stay flat. No new entries allowed.
#
#     Gate OFF + already in a trade
#         → strategy ended but position is still open. Agent manages freely —
#           hold, add, or exit whenever it wants. Agent decides exit timing.
#
#   free : no masking — agent trades freely (Phase 7 / live_improve).
#
# HOW TO ADD A STRATEGY (no code for string conditions): add a phase that uses
#   entry_conditions: {buy: "...", sell: "..."}  (validated against VARIABLE_REGISTRY)
# OR reference an existing named mask via  mask: <name>.
# Run: python scripts/validate_phases_yaml.py
# ────────────────────────────────────────────────────────────────────────────

advance_consecutive_pass_days: 5
max_episodes_per_phase: 500

phases:

  # Phase 1 trains FIRST (order 0): CCI(30) & CCI(100) vs their SMA(1,+8),
  # all four above OR all four below, on both 1m and 15m. force_in_and_gate.
  - name: phase1_cci_align
    order: 0
    mask: phase1_cci_align
    mask_type: force_in_and_gate
    gate_timeframes: [1, 15]
    instruments: [EURUSD]

  - name: phase0_cci_extreme
    order: 1
    mask: phase0_cci_extreme
    mask_type: force_in_and_gate
    gate_timeframes: [1, 15]
    instruments: [EURUSD]

  - name: phase2_hilo_trend
    order: 2
    mask: phase2_hilo_trend
    mask_type: force_in_and_gate
    gate_timeframes: [1, 30]
    instruments: [EURUSD]

  - name: phase3_hilo_counter
    order: 3
    mask: phase3_hilo_counter
    mask_type: force_in_and_gate
    gate_timeframes: [1, 15]
    instruments: [EURUSD]

  - name: phase4_bb_position
    order: 4
    mask: phase4_bb_position
    mask_type: force_in_and_gate
    gate_timeframes: [1, 15]
    instruments: [EURUSD]

  - name: phase5_sma_stack
    order: 5
    mask: phase5_sma_stack
    mask_type: force_in_and_gate
    gate_timeframes: [1, 60]
    instruments: [EURUSD]

  - name: phase6_atr_expansion
    order: 6
    mask: phase6_atr_expansion
    mask_type: force_in_and_gate
    gate_timeframes: [1, 60]
    instruments: [EURUSD]

  - name: phase7_full_ftmo
    order: 7
    mask: null
    mask_type: free
    gate_timeframes: []
    instruments: [EURUSD, GBPUSD, XAUUSD, US30]

  # Infinite continuation after the curriculum completes (free trading).
  - name: live_improve
    order: 999
    mask: null
    mask_type: free
    gate_timeframes: []
    instruments: [EURUSD, GBPUSD, XAUUSD, US30]
    max_episodes: -1          # -1 = infinite; runs until manually stopped
    advance_criteria: null
